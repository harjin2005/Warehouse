[project]
name = "warehouse-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "sqlalchemy==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "pydantic-settings==2.6.1",
    "fastapi-users[sqlalchemy]==14.0.0",
    "python-multipart==0.0.17",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "httpx==0.28.1",
    "testcontainers[postgres]==4.9.0",
    "psycopg2-binary==2.9.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

# Explicit, not auto-discovered: `migrations/` (alembic's script_location,
# never `import migrations`-ed as a package) has no `__init__.py` and sits
# next to `app/` at the repo root. Depending on the setuptools version
# resolved at install time, its flat-layout auto-discovery heuristic can
# either silently ignore `migrations/` (no __init__.py) or hard-fail with
# "Multiple top-level packages discovered: ['app', 'migrations']" -- this
# surfaced as a real `pip install -e .` failure inside the Dockerfile's
# fresh build (a newer setuptools than whatever the existing dev venv had
# cached). Pinning discovery to `app` only makes the install deterministic
# regardless of setuptools version, in Docker, CI, or a fresh dev venv.
[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
